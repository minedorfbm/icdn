name: Validate hub

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run security:audit
      - run: bun run migrations:check
      - run: bun run migrations:test
      - run: bun run i18n:check
      - run: bun run images:check
      - run: bun run test:coverage
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - run: bun run test:mobile:install
      - run: bun run test:mobile
      - run: bun run deploy:check
      - run: bun run test:mobile:coverage
      - run: bun run coverage:check-production
      - name: Save unit and mobile coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14
      # Enable only after SONAR_TOKEN is configured and automatic analysis has
      # been switched off for this project. Never expose the token to fork PRs.
      - name: Check Sonar authentication
        if: vars.SONAR_CI_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::SONAR_CI_ENABLED requires the SONAR_TOKEN repository secret.'
            exit 1
          fi
      - name: Analyze code and unit/mobile coverage in SonarCloud
        if: vars.SONAR_CI_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          skipSignatureVerification: false
          args: -Dsonar.qualitygate.wait=true
