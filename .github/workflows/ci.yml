name: Validate hub

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only superseded PR revisions are cancelled; running main checks finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Code and data checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Bun manages dependencies; keep setup-node's automatic npm cache off.
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run security:audit
      - run: bun run migrations:check
      - run: bun run migrations:test
      - run: bun run i18n:check
      - run: bun run images:check
      - run: bun run test:coverage
      - run: bun run typecheck
      - run: bun run lint
      - name: Save unit coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  browser:
    name: ${{ matrix.mode }} / ${{ matrix.project }} / shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [production, coverage]
        project: [iphone-webkit, android-chrome]
        # Separate runners preserve the single-worker mock server/cache isolation.
        # Every spec still runs in all four production/coverage + browser combinations.
        shard: [1, 2, 3]
        include:
          - project: iphone-webkit
            browser: webkit
          - project: android-chrome
            browser: chromium
    env:
      HUB_TEST_PROJECT: ${{ matrix.project }}
      HUB_BROWSER_COVERAGE: ${{ matrix.mode == 'coverage' && '1' || '0' }}
      PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build production application
        if: matrix.mode == 'production'
        run: bun run build
      - name: Verify production deployment and instrumentation isolation
        if: matrix.mode == 'production'
        run: |
          bun run deploy:check
          bun run coverage:check-production
      - name: Build instrumented test application
        if: matrix.mode == 'coverage'
        run: bun run build:coverage
      - name: Install selected browser
        env:
          TEST_BROWSER: ${{ matrix.browser }}
        run: node node_modules/@playwright/test/cli.js install --with-deps "$TEST_BROWSER"
      - name: Run selected-browser shard
        env:
          TEST_PROJECT: ${{ matrix.project }}
          TEST_SHARD: ${{ matrix.shard }}
        run: node node_modules/@playwright/test/cli.js test --project="$TEST_PROJECT" --shard="$TEST_SHARD/3" --reporter=line,json
      - name: Save browser results and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results-${{ matrix.mode }}-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results
          if-no-files-found: error
          retention-days: 7
      - name: Save browser coverage snapshots
        if: matrix.mode == 'coverage'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-coverage-${{ matrix.project }}-${{ matrix.shard }}
          path: coverage/browser/raw/*.json
          if-no-files-found: error
          retention-days: 14

  validate:
    name: validate
    needs: [checks, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require every code and browser check to succeed
        env:
          CODE_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          if [ "$CODE_RESULT" != 'success' ] || [ "$BROWSER_RESULT" != 'success' ]; then
            echo '::error::All code checks and all twelve browser shards must pass.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Restore unit coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-coverage
          path: coverage
      - name: Restore both browser coverage collections
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: browser-coverage-*
          path: coverage/browser/raw
          merge-multiple: true
      - name: Merge and validate browser coverage
        run: bun scripts/report-browser-coverage.ts
      - name: Save unit and mobile coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-coverage
          path: |
            coverage/lcov.info
            coverage/browser/lcov.info
            coverage/browser/coverage-summary.json
            coverage/browser/summary.md
          if-no-files-found: error
          retention-days: 14
      # Enable only after SONAR_TOKEN is configured and automatic analysis has
      # been switched off for this project. Never expose the token to fork PRs.
      - name: Check Sonar authentication
        if: vars.SONAR_CI_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::SONAR_CI_ENABLED requires the SONAR_TOKEN repository secret.'
            exit 1
          fi
      - name: Analyze code and unit/mobile coverage in SonarCloud
        if: vars.SONAR_CI_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          skipSignatureVerification: false
          args: -Dsonar.qualitygate.wait=true
