sonar.organization=minedorfbm
sonar.projectKey=minedorfbm_nam-tram-journey
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Keep application, SQL and tooling in scope; classify tests separately.
sonar.sources=.
sonar.tests=tests,e2e
# Binary image assets are not UTF-8 source; keep SVG, application code and SQL analyzed.
sonar.exclusions=tests/**,e2e/**,**/*.webp,**/*.png,**/*.ico,**/*.avif,**/*.jpg,**/*.jpeg
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage/browser/lcov.info

# Editorial snapshots and the already-applied Yoga Wheel follow-up retain their
# replay guards. Exclude only CPD for that historical migration; all SQL remains
# in security/quality analysis and PostgreSQL replay tests.
sonar.cpd.exclusions=src/i18n/dictionary.ko.json,src/i18n/dictionary.ja.json,scripts/translation-snapshot/destinations.ko.json,scripts/translation-snapshot/destinations.ja.json,scripts/translation-snapshot/events.ko.json,scripts/translation-snapshot/events.ja.json,supabase/migrations/20260925120000_korean_japanese_translations.sql,supabase/migrations/20261016180000_yoga_wheel_stretch.sql
